server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5434/lms
spring.datasource.username=emc
spring.datasource.password=emc


spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Materialized view refresh settings
app.category-stats.refresh.fixed-delay-ms=60000
app.category-stats.refresh.concurrently=true

# JWT settings (minimal)
# NOTE: keep this secret at least 32 chars; for real deployments use env vars.
jwt.secret=please-change-this-to-a-long-random-secret-at-least-32-bytes
jwt.issuer=lab-final
jwt.expiration-seconds=3600

